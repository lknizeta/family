<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f6feb"><title>Familia</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fa;color:#1c2333}
main{max-width:560px;margin:auto;padding:16px}
h1{font-size:20px;margin:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.c{background:#fff;border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #0001}
.d{font-weight:600;margin:16px 0 4px;text-transform:capitalize}
.f{border-left:4px solid #e0a800}button,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #ccd}
button{background:#1f6feb;color:#fff;border:0;cursor:pointer}.g{background:#e8ecf4;color:#333}
input{width:100%;box-sizing:border-box;margin:4px 0}.r{display:flex;gap:8px;align-items:center;justify-content:space-between}
</style></head><body><main id="app"></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAkmRRIwMgL6010-69IKBxPgI_Vk5pTDB4",authDomain:"iceta-family.firebaseapp.com",projectId:"iceta-family",storageBucket:"iceta-family.firebasestorage.app",messagingSenderId:"865254703231",appId:"1:865254703231:web:1c14f31ad46ac751fb3f4a"});
const auth=getAuth(app),db=getFirestore(app),A=document.getElementById("app");
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let me=null,evs=[],unsub=null;
// Hábitos fijos de los padres: no se guardan, se calculan, así que no se pueden borrar ni mover
const HAB=[["💶 Gastos",21],["🧾 Pagos",28]];
function habitos(){const o=[],n=new Date();for(let i=0;i<12;i++)for(const[t,d]of HAB)o.push({id:`h${i}${d}`,title:t,start:new Date(n.getFullYear(),n.getMonth()+i,d,20,0),fixed:true});return o}
function login(){A.innerHTML=`<div class="c"><h1>Familia</h1><p>Entra con tu cuenta de Google.</p><button id="b">Entrar con Google</button></div>`;
document.getElementById("b").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert(e.message))}
onAuthStateChanged(auth,async u=>{if(!u)return login();
const r=doc(db,"users",u.uid);let s=await getDoc(r);
if(!s.exists()){let role=IOS?"padre":await pick();await setDoc(r,{name:u.displayName,email:u.email,role});s=await getDoc(r)}
me={uid:u.uid,...s.data()};if(unsub)unsub();
unsub=onSnapshot(collection(db,"events"),q=>{evs=q.docs.map(d=>({id:d.id,...d.data(),start:new Date(d.data().start)}));draw()})});
function pick(){return new Promise(ok=>{A.innerHTML=`<div class="c"><h1>¿Quién eres?</h1>${["madre","hijo 1","hijo 2"].map(x=>`<p><button data-r="${x}">${x}</button></p>`).join("")}</div>`;
A.querySelectorAll("button").forEach(b=>b.onclick=()=>ok(b.dataset.r))})}
function draw(){const now=Date.now()-864e5;
const all=[...evs,...habitos()].filter(e=>e.start>=now).sort((a,b)=>a.start-b.start);let day="",h="";
for(const e of all){const k=e.start.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
if(k!==day){day=k;h+=`<div class="d">${k}</div>`}
h+=`<div class="c r ${e.fixed?"f":""}"><span>${e.start.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})} · ${esc(e.title)}${e.fixed?" 🔒":""}</span>${e.fixed?"":`<span><button class="g" data-e="${e.id}">✏️</button> <button class="g" data-x="${e.id}">🗑️</button></span>`}</div>`}
A.innerHTML=`<header><h1>📅 Calendario</h1><button class="g" id="o">Salir (${esc(me.role)})</button></header>
<div class="c"><input id="t" placeholder="Nuevo evento"><input id="w" type="datetime-local"><button id="a">Añadir</button></div>${h}`;
document.getElementById("o").onclick=()=>signOut(auth);
document.getElementById("a").onclick=async()=>{const t=document.getElementById("t").value.trim(),w=document.getElementById("w").value;
if(!t||!w)return alert("Pon título y fecha");await addDoc(collection(db,"events"),{title:t,start:new Date(w).toISOString(),by:me.uid})};
A.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>confirm("¿Borrar?")&&deleteDoc(doc(db,"events",b.dataset.x)));
A.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const e=evs.find(x=>x.id===b.dataset.e),t=prompt("Título",e.title);if(t)updateDoc(doc(db,"events",e.id),{title:t})})}
</script></body></html>
