<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f6feb"><title>Familia</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fa;color:#1c2333}
main{max-width:560px;margin:auto;padding:16px}
h1{font-size:20px;margin:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.c{background:#fff;border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #0001}
.d{font-weight:600;margin:16px 0 4px;text-transform:capitalize}.f{border-left:4px solid #e0a800}
button,input,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #ccd}
button{background:#1f6feb;color:#fff;border:0;cursor:pointer}.g{background:#e8ecf4;color:#333}
input,select{width:100%;box-sizing:border-box;margin:4px 0}.r{display:flex;gap:8px;align-items:center;justify-content:space-between}
.n{display:flex;gap:6px;margin:8px 0}.n button{flex:1}
</style></head><body><main id="app"></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAkmRRIwMgL6010-69IKBxPgI_Vk5pTDB4",authDomain:"iceta-family.firebaseapp.com",projectId:"iceta-family",storageBucket:"iceta-family.firebasestorage.app",messagingSenderId:"865254703231",appId:"1:865254703231:web:1c14f31ad46ac751fb3f4a"});
const auth=getAuth(app),db=getFirestore(app),A=document.getElementById("app"),$=i=>document.getElementById(i);
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent),ADMIN="lknizeta@gmail.com",HASH="49faaade493be8b6b6164ee67f7e4d101812a5dda970d6ca693dda8b8cf82e4b";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F=d=>d.toLocaleString("es-ES",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
let me=null,evs=[],polls=[],pun=[],users={},tab="cal",ok=sessionStorage.getItem("k")=="1",started=false;
const isAdm=()=>me.email==ADMIN;
const HAB=[["💶 Gastos",21],["🧾 Pagos",28]];
function habitos(){const o=[],n=new Date();for(let i=0;i<12;i++)for(const[t,d]of HAB)o.push({id:`h${i}${d}`,title:t,start:new Date(n.getFullYear(),n.getMonth()+i,d,20,0),fixed:true});return o}
function login(){A.innerHTML=`<div class="c"><h1>Familia</h1><p>Entra con tu cuenta de Google.</p><button id="b">Entrar con Google</button></div>`;
$("b").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert(e.message))}
function pick(){return new Promise(r=>{A.innerHTML=`<div class="c"><h1>¿Quién eres?</h1>${["madre","hijo 1","hijo 2"].map(x=>`<p><button data-r="${x}">${x}</button></p>`).join("")}</div>`;
A.querySelectorAll("button").forEach(b=>b.onclick=()=>r(b.dataset.r))})}
onAuthStateChanged(auth,async u=>{if(!u)return login();
const r=doc(db,"users",u.uid);let s=await getDoc(r);
if(!s.exists()){let role=IOS?"padre":await pick();await setDoc(r,{name:u.displayName,email:u.email,role});s=await getDoc(r)}
me={uid:u.uid,...s.data()};if(started)return;started=true;
const sub=(n,f)=>onSnapshot(collection(db,n),q=>{f(q.docs.map(d=>({id:d.id,...d.data()})));draw()});
sub("events",a=>{evs=a.map(e=>({...e,start:new Date(e.start)}))});sub("polls",a=>{polls=a});sub("punishments",a=>{pun=a});sub("users",a=>{users=Object.fromEntries(a.map(x=>[x.id,x]))})});
function vCal(){const now=Date.now()-864e5,all=[...evs,...habitos()].filter(e=>e.start>=now).sort((a,b)=>a.start-b.start);let day="",h="";
for(const e of all){const k=e.start.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});if(k!==day){day=k;h+=`<div class="d">${k}</div>`}
h+=`<div class="c r ${e.fixed?"f":""}"><span>${e.start.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})} · ${esc(e.title)}${e.fixed?" 🔒":""}</span>${e.fixed?"":`<span><button class="g" data-a="e|${e.id}">✏️</button> <button class="g" data-a="x|${e.id}">🗑️</button></span>`}</div>`}
return`<div class="c"><input id="t" placeholder="Nuevo evento"><input id="w" type="datetime-local"><button id="a">Añadir</button></div>${h}`}
function vEnc(){return`<div class="c"><b>Proponer un plan</b><input id="pt" placeholder="¿Qué plan?"><input id="pw" type="datetime-local"><button id="pa">Proponer</button></div>`+
polls.sort((a,b)=>new Date(a.start)-new Date(b.start)).map(p=>{const v=p.votes||{},n=Object.values(v),si=n.filter(x=>x=="si").length,no=n.length-si,my=v[me.uid];
return`<div class="c"><b>${esc(p.title)}</b><br>${F(new Date(p.start))}<br>👍 ${si} · 👎 ${no} · <i>${p.status}</i>`+
(p.status=="abierta"?`<div class="r"><span><button class="${my=="si"?"":"g"}" data-a="v|${p.id}|si">Sí</button> <button class="${my=="no"?"":"g"}" data-a="v|${p.id}|no">No</button></span>${p.by==me.uid||isAdm()?`<button class="g" data-a="c|${p.id}">Cerrar</button>`:""}</div>`:"")+
(p.status=="guardada"?`<br><button class="g" data-a="r|${p.id}">Volver a proponer</button>`:"")+`</div>`}).join("")}
function vTab(){const l=pun.filter(p=>p.pub).sort((a,b)=>b.at-a.at);return l.length?l.map(p=>`<div class="c">⚖️ <b>${esc(p.text)}</b><br>Para: ${esc(p.to)} · ${p.st}${(p.to=="todos"||p.to==me.role)&&!p.seen?.[me.uid]?`<br><button data-a="s|${p.id}">Enterado</button>`:""}</div>`).join(""):`<div class="c">No hay castigos publicados.</div>`}
function vAdm(){if(!isAdm())return`<div class="c">Solo para el admin.</div>`;
if(!ok)return`<div class="c"><input id="k" type="password" placeholder="Clave de admin"><button id="kk">Entrar</button></div>`;
const past=evs.filter(e=>e.start<Date.now()&&e.start>Date.now()-12096e5&&!e.ev).sort((a,b)=>b.start-a.start);
return`<div class="c"><b>Nuevo castigo</b><input id="xt" placeholder="Castigo"><select id="xr">${["todos","madre","hijo 1","hijo 2","padre"].map(x=>`<option>${x}</option>`).join("")}</select><button id="xa">Publicar en el tablón</button></div>
<div class="d">Eventos por evaluar</div>${past.map(e=>`<div class="c r"><span>${F(e.start)} · ${esc(e.title)}</span><span><button class="g" data-a="y|${e.id}">✅</button> <button class="g" data-a="n|${e.id}">❌</button></span></div>`).join("")||`<div class="c">Nada pendiente.</div>`}
<div class="d">Castigos</div>${pun.sort((a,b)=>b.at-a.at).map(p=>`<div class="c">${esc(p.text)} → ${esc(p.to)} · ${p.st}${p.pub?"":" · sin publicar"}<div class="r">${p.pub?"<span></span>":`<button class="g" data-a="pp|${p.id}">Publicar</button>`}<span><button class="g" data-a="po|${p.id}">✅</button> <button class="g" data-a="pk|${p.id}">❌</button> <button class="g" data-a="pd|${p.id}">🗑️</button></span></div></div>`).join("")}`}
function draw(){if(!me||document.activeElement?.tagName=="INPUT")return;
const nav=[["cal","📅"],["enc","🗳️"],["tab","⚖️"],...(isAdm()?[["adm","🔧"]]:[])];
A.innerHTML=`<header><h1>Familia</h1><button class="g" data-a="o">Salir (${esc(me.role)})</button></header><div class="n">${nav.map(([k,l])=>`<button class="${tab==k?"":"g"}" data-a="t|${k}">${l}</button>`).join("")}</div>${{cal:vCal,enc:vEnc,tab:vTab,adm:vAdm}[tab]()}`;
A.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(...b.dataset.a.split("|")));
const bt=(i,f)=>$(i)&&($(i).onclick=f),V=i=>$(i).value.trim();
bt("a",async()=>{if(!V("t")||!V("w"))return alert("Pon título y fecha");await addDoc(collection(db,"events"),{title:V("t"),start:new Date(V("w")).toISOString(),by:me.uid})});
bt("pa",async()=>{if(!V("pt")||!V("pw"))return alert("Pon plan y fecha");await addDoc(collection(db,"polls"),{title:V("pt"),start:new Date(V("pw")).toISOString(),by:me.uid,votes:{},status:"abierta"})});
bt("kk",async()=>{if(await sha(V("k"))==HASH){ok=true;sessionStorage.setItem("k","1");draw()}else alert("Clave incorrecta")});
bt("xa",async()=>{if(!V("xt"))return;await addDoc(collection(db,"punishments"),{text:V("xt"),to:$("xr").value,st:"pendiente",pub:true,at:Date.now()})})}
async function act(k,a,b){const D=(c,i)=>doc(db,c,i),U=(c,i,d)=>updateDoc(D(c,i),d);
if(k=="o")return signOut(auth);if(k=="t"){tab=a;return draw()}
if(k=="x"&&confirm("¿Borrar?"))await deleteDoc(D("events",a));
if(k=="e"){const e=evs.find(x=>x.id==a),t=prompt("Título",e.title);if(t)await U("events",a,{title:t})}
if(k=="v")await U("polls",a,{["votes."+me.uid]:b});
if(k=="c"){const p=polls.find(x=>x.id==a),v=Object.values(p.votes||{}),w=v.filter(x=>x=="si").length>v.filter(x=>x=="no").length;
await U("polls",a,{status:w?"ganada":"guardada"});if(w)await addDoc(collection(db,"events"),{title:p.title,start:p.start,by:p.by})}
if(k=="r")await U("polls",a,{status:"abierta",votes:{}});
if(k=="s")await U("punishments",a,{["seen."+me.uid]:true});
if(k=="y")await U("events",a,{ev:"ok"});
if(k=="n"){const e=evs.find(x=>x.id==a),r=users[e.by]?.role||"todos";await U("events",a,{ev:"ko"});const t=prompt("Castigo para "+r+" (vacío = ninguno)");if(t)await addDoc(collection(db,"punishments"),{text:t,to:r,st:"pendiente",pub:false,at:Date.now()})}
if(k=="pp")await U("punishments",a,{pub:true});
if(k=="po")await U("punishments",a,{st:"cumplido"});
if(k=="pk")await U("punishments",a,{st:"incumplido"});
if(k=="pd"&&confirm("¿Borrar?"))await deleteDoc(D("punishments",a))}
</script></body></html>
